<title>قارئ الصغار 🌙</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;800&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
:root{--g:#58cc02;--gd:#46a302;--b:#1cb0f6;--bd:#1899d6;--r:#ff4b4b;--o:#ff9600;--y:#ffc800}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Baloo Bhaijaan 2',Tahoma,sans-serif;color:#3c3c3c;
 background:linear-gradient(#bde9ff,#fff6d6);display:flex;justify-content:center}
#app{width:100%;max-width:640px;padding:16px}
.card{background:#fff;border-radius:28px;border:3px solid #e5e5e5;padding:20px;margin-top:14px;text-align:center}
h1{margin:0;font-size:34px}
.mascot{font-size:70px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.bubble{background:#fff;border:3px solid #e5e5e5;border-radius:20px;padding:8px 16px;display:inline-block;font-size:19px;margin-top:6px}
input{width:100%;font:inherit;font-size:22px;padding:12px 16px;border-radius:18px;border:3px solid #e5e5e5;text-align:center;margin:12px 0}
input:focus{outline:none;border-color:var(--b)}
.btn{font:inherit;font-size:22px;font-weight:800;color:#fff;border:0;border-radius:18px;padding:12px 26px;margin:6px;cursor:pointer;
 background:var(--g);box-shadow:0 5px 0 var(--gd)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gd)}
.btn.blue{background:var(--b);box-shadow:0 5px 0 var(--bd)}
.btn.red{background:var(--r);box-shadow:0 5px 0 #d33}
.btn[disabled]{opacity:.4;pointer-events:none}
.top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:18px;background:#e5e5e5;border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--g);border-radius:10px;transition:width .5s}
.ayah{font-family:'Amiri Quran',serif;font-size:38px;line-height:2.3;padding:6px}
.w{display:inline-block;padding:0 7px;margin:2px;border-radius:12px;transition:.25s}
.w.ok{background:#d7ffb8;color:#2b8a00;transform:scale(1.12)}
.w.miss{background:#ffdfe0;color:#c62828}
.w.late{background:#fff0cc;color:#b36b00}
.num{background:var(--y);border-radius:50%;display:inline-block;width:42px;height:42px;line-height:42px;font-size:22px;font-weight:800}
.mic{font-size:20px}.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px #ff4b4b33}}
.hide{display:none}
.doneayah{background:#d7ffb8;border:3px solid #58cc02;border-radius:22px;margin-top:10px;padding:6px 14px;font-family:'Amiri Quran',serif;font-size:30px;line-height:2.1;text-align:center}
.doneayah.gaveup{background:#ffdfe0;border-color:#ff4b4b}
.num.sm{width:30px;height:30px;line-height:30px;font-size:16px;font-family:'Baloo Bhaijaan 2',sans-serif}
.blank{color:#c9c9c9;background:#f3f3f3}
.pop{position:fixed;font-size:34px;pointer-events:none;animation:fly 1.4s ease-out forwards}
@keyframes fly{to{transform:translateY(-260px) rotate(40deg);opacity:0}}
.list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:150px;overflow:auto}
.chip{background:#f0f9ff;border:2px solid #cdeaff;border-radius:14px;padding:2px 10px;cursor:pointer;font-size:17px}
</style></head><body><div id="app">

<div id="home" class="card">
  <div class="mascot">🐥</div>
  <h1>يلا نقرأ قرآن! 🌙</h1>
  <div class="bubble">اختر السورة، وبعدين اختر: قراءة أو تسميع غيب</div>
  <input id="q" list="dl" placeholder="اكتب اسم السورة... مثال: الفاتحة" autocomplete="off">
  <datalist id="dl"></datalist>
  <div class="list" id="chips"></div>
  <button class="btn" id="go">📖 قراءة</button>
  <button class="btn blue" id="gh">🧠 تسميع غيب</button>
  <div id="err" style="color:var(--r)"></div>
</div>

<div id="lesson" class="hide">
  <div class="top"><button class="btn red" id="back" style="padding:4px 14px;font-size:18px">✖</button>
   <div class="bar"><i id="bar"></i></div><div id="xp">⭐ 0</div></div>
  <div class="card">
    <span class="num" id="num">1</span>
    <div class="ayah" id="ayah"></div>
    <div class="bubble" id="say">🐥 اسمع الآية أول، وبعدين اقرأها!</div>
    <div>
      <button class="btn blue" id="listen">🔊 اسمع</button>
      <button class="btn" id="mic">🎤 ابدأ القراءة</button>
      <button class="btn blue hide" id="next">التالي ➡️</button>
    </div>
  </div>
</div>

<div id="gh_screen" class="hide">
  <div class="top"><button class="btn red" id="ghback" style="padding:4px 14px;font-size:18px">✖</button>
   <div class="bar"><i id="gbar"></i></div><div id="gxp">⭐ 0</div></div>
  <div id="rev"></div>
  <div class="card">
    <span class="num" id="gnum">1</span>
    <div class="ayah" id="gcur"></div>
    <div class="bubble" id="gsay"></div>
    <div>
      <button class="btn" id="gmic">🎤 ابدأ التسميع</button>
      <button class="btn blue" id="ghint">💡 تلميح</button>
      <button class="btn red" id="gshow">👀 أظهر الآية</button>
    </div>
  </div>
</div>

<div id="done" class="card hide">
  <div class="mascot">🏆</div><h1>ما شاء الله! خلصت السورة</h1>
  <div class="bubble" id="final"></div><br>
  <button class="btn" onclick="location.reload()">سورة ثانية 🎈</button>
</div>
</div>

<script>
const $=s=>document.querySelector(s);
const AR_PASS=0.8;      // نسبة الكلمات الصح المطلوبة للنجاح
const SILENCE_MS=2000;  // كم ثانية سكوت قبل ما يفحص
const norm=t=>t.replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'')
  .replace(/[إأآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
  .replace(/[^\u0621-\u064A ]/g,'').replace(/\s+/g,' ').trim();

function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
   d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n]}
const sim=(a,b)=>a&&b?1-lev(a,b)/Math.max(a.length,b.length):0;

// يطابق كلامك مع كلمات الآية بالترتيب (يسمح بتخطي كلمة أو كلمتين)
function align(spoken,target){
  const st=Array(target.length).fill('');st.used=0;let i=0;
  for(let si=0;si<spoken.length;si++){const w=spoken[si];
    for(let j=i;j<Math.min(i+3,target.length);j++){
      if(sim(w,target[j])>=0.7){for(let k=i;k<j;k++)st[k]='late';st[j]='ok';i=j+1;st.used=si+1;break}
    }
  }
  return st}

// ===== جلب القرآن مباشرة من المتصفح (بدون سيرفر) =====
const API='https://api.alquran.cloud/v1';
async function getSurahs(){
  const r=await fetch(API+'/surah');if(!r.ok)throw 0;
  return (await r.json()).data.map(s=>({n:s.number,name:s.name,count:s.numberOfAyahs}))}
async function getSurah(n){
  const r=await fetch(`${API}/surah/${n}/editions/quran-uthmani,quran-simple-clean,ar.alafasy`);if(!r.ok)throw 0;
  const [uth,clean,audio]=(await r.json()).data.map(e=>e.ayahs);
  return uth.map((u,i)=>{
    let uw=u.text.split(/\s+/).filter(Boolean),cw=clean[i].text.split(/\s+/).filter(Boolean);
    if(u.numberInSurah===1&&n!==1&&n!==9&&cw.length>4){uw=uw.slice(4);cw=cw.slice(4)} // نشيل البسملة
    if(uw.length!==cw.length)uw=cw;
    return {n:u.numberInSurah,words:uw,match:cw,audio:audio[i].audio}})}

let surahs=[],ayat=[],idx=0,xp=0,rec=null,listening=false,lastSpeech=0,timer=null,transcript='',audio=null,sid=0;

async function init(){
  try{
    surahs=await getSurahs();
    $('#dl').innerHTML=surahs.map(s=>`<option value="${norm(s.name).replace(/^سوره /,'')}">`).join('');
    $('#chips').innerHTML=surahs.slice(-30).reverse().map(s=>`<span class="chip" data-n="${s.n}">${norm(s.name).replace(/^سوره /,'')}</span>`).join('');
    $('#chips').onclick=e=>{if(e.target.dataset.n)$('#q').value=e.target.textContent};
  }catch(e){$('#err').textContent='ما قدرت أتصل بالإنترنت 😢'}
}
const pick=mode=>{
  const q=norm($('#q').value).replace(/^سوره /,'');
  const s=surahs.find(s=>String(s.n)===q||norm(s.name).replace(/^سوره /,'').replace(/^ال/,'')===q.replace(/^ال/,''))
        ||surahs.find(s=>norm(s.name).includes(q));
  if(!q||!s){$('#err').textContent='ما لقيت السورة، جرب تكتبها بشكل ثاني 🤔';return}
  start(s.n,mode)};
$('#go').onclick=()=>pick('read');$('#gh').onclick=()=>pick('gh');

async function start(n,mode){
  $('#err').textContent='';
  try{ayat=await getSurah(n)}catch(e){$('#err').textContent='صار خطأ بالتحميل 😢';return}
  idx=0;xp=0;sid=n;
  $('#home').classList.add('hide');
  if(mode==='gh'){ghStart();return}
  $('#lesson').classList.remove('hide');show();
}

function show(){
  const a=ayat[idx];transcript='';
  $('#num').textContent=a.n;
  $('#ayah').innerHTML=a.words.map((w,i)=>`<span class="w" id="w${i}">${w}</span>`).join(' ');
  $('#bar').style.width=(idx/ayat.length*100)+'%';$('#xp').textContent='⭐ '+xp;
  $('#next').classList.add('hide');$('#mic').classList.remove('hide');$('#mic').disabled=false;
  say('🐥 اسمع الآية أول، وبعدين اقرأها!');
}
const say=t=>$('#say').textContent=t;

function paint(st,final){
  st.forEach((s,i)=>{const el=$('#w'+i);
    el.className='w'+(s==='ok'?' ok':final&&s==='late'?' late':final&&s===''?' miss':'')});}

$('#listen').onclick=()=>{
  if(audio)audio.pause();const u=ayat[idx].audio;if(!u)return;
  audio=new Audio(u);audio.play();};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('#mic').onclick=()=>{
  unlockAudio();
  if(!SR){say('😢 افتح التطبيق من متصفح Chrome');return}
  if(listening){finish();return}
  if(audio)audio.pause();
  rec=new SR();rec.lang='ar-SA';rec.continuous=true;rec.interimResults=true;
  transcript='';lastSpeech=0;paint(Array(ayat[idx].words.length).fill(''),false);
  rec.onresult=e=>{
    transcript=[...e.results].map(r=>r[0].transcript).join(' ');lastSpeech=Date.now();
    paint(align(norm(transcript).split(' '),ayat[idx].match.map(norm)),false);
    say('🐥 أسمعك... كمّل!');};
  rec.onerror=e=>{if(e.error==='not-allowed')say('🎤 اسمح للمتصفح باستخدام المايك');};
  rec.onend=()=>{if(listening)finish()};
  rec.start();listening=true;
  $('#mic').textContent='⏹ خلصت';$('#mic').classList.add('pulse','red');
  say('🐥 يلا اقرأ الآية!');
  timer=setInterval(()=>{if(lastSpeech&&Date.now()-lastSpeech>SILENCE_MS)finish()},300);
};

function finish(){
  if(!listening)return;listening=false;clearInterval(timer);
  try{rec.stop()}catch(e){}
  $('#mic').textContent='🎤 ابدأ القراءة';$('#mic').classList.remove('pulse','red');
  const tg=ayat[idx].match.map(norm),st=align(norm(transcript).split(' '),tg);
  paint(st,true);
  const ok=st.filter(s=>s==='ok').length,ratio=ok/tg.length;
  if(!transcript.trim()){say('🐥 ما سمعتك.. جرب مرة ثانية 🎤');beep(false);return}
  if(ratio>=AR_PASS){
    xp+=10;$('#xp').textContent='⭐ '+xp;
    say(ratio===1?'🎉 ممتاز ما شاء الله! كل الكلمات صح!':'👏 حلو! بس انتبه للكلمات الملونة');
    celebrate();beep(true);$('#mic').classList.add('hide');$('#next').classList.remove('hide');
  }else{
    say('💪 قريب! الكلمات الحمراء ما سمعتها، حاول مرة ثانية');beep(false);
  }
}
$('#next').onclick=()=>{
  if(++idx>=ayat.length){$('#lesson').classList.add('hide');$('#done').classList.remove('hide');
    $('#final').textContent='جمعت ⭐ '+xp+' نجمة!';celebrate();celebrate();return}
  show()};
$('#back').onclick=()=>location.reload();

function celebrate(){
  for(let i=0;i<14;i++){const p=document.createElement('div');p.className='pop';
    p.textContent=['⭐','🎉','🌟','✨','🎈'][i%5];p.style.left=Math.random()*90+'vw';p.style.top=(55+Math.random()*30)+'vh';
    p.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),2000)}}
// ===== التغذية الراجعة بالصوت: "صح" و "لا" (بدون نغمات) =====
function speak(t,cb){
  let called=false;const done=()=>{if(!called){called=true;cb&&cb()}};
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);
    u.lang='ar-SA';u.rate=.95;u.pitch=1.2;u.onend=done;u.onerror=done;speechSynthesis.speak(u);setTimeout(done,1800)}
  catch(e){done()}}
function beep(good){speak(good?'صح':'لا')}
function unlockAudio(){}

// ===== قسم التسميع الغيبي =====
const GH_SILENCE=4000; // سكوت بعده نعتبرها محاولة غلط
const gh={on:false,paused:false,k:0,base:0,total:0,fails:0,hint:0,xp:0,rec:null,last:0,timer:null};
const gsay=t=>$('#gsay').textContent=t;

function ghStart(){
  $('#gh_screen').classList.remove('hide');$('#rev').innerHTML='';
  gh.k=0;gh.xp=0;gh.on=false;ghCard();
}
function ghCard(){
  const a=ayat[gh.k];gh.fails=0;gh.hint=0;
  $('#gnum').textContent=a.n;$('#gbar').style.width=(gh.k/ayat.length*100)+'%';$('#gxp').textContent='⭐ '+gh.xp;
  ghPaint(Array(a.words.length).fill(''));
  gsay(gh.on?'🐥 كمّل، أنا أسمعك!':'🐥 اضغط ابدأ وسمّع من حفظك، وأنا أظهر الآيات الصح!');
  $('#gcur').scrollIntoView({behavior:'smooth',block:'center'});
}
function ghPaint(st){
  const a=ayat[gh.k];
  $('#gcur').innerHTML=a.words.map((w,i)=>st[i]==='ok'?`<span class="w ok">${w}</span>`
    :i<gh.hint?`<span class="w late">${w}</span>`:`<span class="w blank">＿＿</span>`).join(' ');
}
function ghRec(){
  if(!SR){gsay('😢 افتح التطبيق من متصفح Chrome');return}
  if(gh.rec){gh.rec.onend=null;gh.rec.onresult=null;try{gh.rec.abort()}catch(e){}}
  const r=new SR();gh.rec=r;r.lang='ar-SA';r.continuous=true;r.interimResults=true;gh.base=0;gh.total=0;
  r.onresult=e=>{
    if(!gh.on||gh.paused)return;
    const sp=norm([...e.results].map(x=>x[0].transcript).join(' ')).split(' ').filter(Boolean);
    gh.last=Date.now();gh.total=sp.length;ghCheck(sp)};
  r.onerror=e=>{if(e.error==='not-allowed'){gh.on=false;gsay('🎤 اسمح للمتصفح باستخدام المايك')}};
  r.onend=()=>{if(gh.on&&!gh.paused)ghRec()};
  try{r.start()}catch(e){}
}
function ghCheck(sp){
  const tg=ayat[gh.k].match.map(norm),part=sp.slice(gh.base),st=align(part,tg);
  ghPaint(st);gsay('🐥 أسمعك... كمّل!');
  const ok=st.filter(s=>s==='ok').length;
  if(st[tg.length-1]==='ok'&&ok/tg.length>=AR_PASS){gh.base+=st.used;ghDone(st,true)}
}
function ghDone(st,good){
  const a=ayat[gh.k];
  const d=document.createElement('div');d.className='doneayah'+(good?'':' gaveup');
  d.innerHTML=`<span class="num sm">${a.n}</span> `+a.words.map((w,i)=>
    `<span class="w ${good?(st[i]==='ok'?'ok':'late'):'miss'}">${w}</span>`).join(' ');
  $('#rev').appendChild(d);
  if(good){gh.xp+=10;celebrate();ghSpeak(true)}
  gh.k++;gh.last=0;
  if(gh.k>=ayat.length){ghEnd();return}
  ghCard();
}
function ghSpeak(good){ // نوقف المايك وقت الكلام عشان ما يسمع نفسه
  if(!gh.on){speak(good?'صح':'لا');return}
  gh.paused=true;try{gh.rec.abort()}catch(e){}
  speak(good?'صح':'لا',()=>{gh.paused=false;if(gh.on)ghRec()});
}
function ghEnd(){
  gh.on=false;clearInterval(gh.timer);try{gh.rec.abort()}catch(e){}
  $('#gh_screen').classList.add('hide');$('#done').classList.remove('hide');
  $('#final').textContent='سمّعت السورة غيب! ⭐ '+gh.xp+' نجمة';celebrate();celebrate();
}
$('#gmic').onclick=()=>{
  if(gh.on){gh.on=false;clearInterval(gh.timer);try{gh.rec.abort()}catch(e){}
    $('#gmic').textContent='🎤 كمّل التسميع';$('#gmic').classList.remove('pulse','red');gsay('🐥 وقفنا.. كمّل لمن تبي!');return}
  gh.on=true;gh.paused=false;gh.last=0;ghRec();
  $('#gmic').textContent='⏹ وقف';$('#gmic').classList.add('pulse','red');gsay('🐥 يلا سمّع من حفظك!');
  clearInterval(gh.timer);
  gh.timer=setInterval(()=>{
    if(!gh.on||gh.paused||!gh.last||Date.now()-gh.last<GH_SILENCE)return;
    gh.last=0;gh.fails++;gh.base=gh.total;            // نبدأ المحاولة من جديد
    if(gh.fails>=2&&gh.hint<1)gh.hint=1;               // بعد غلطتين نعطيه أول كلمة
    ghPaint(Array(ayat[gh.k].words.length).fill(''));
    gsay(gh.fails>=2?'💪 قريب! هذي أول كلمة، حاول مرة ثانية':'🐥 ما صح.. حاول تعيد الآية');
    ghSpeak(false);
  },400);
};
$('#ghint').onclick=()=>{gh.hint=Math.min(gh.hint+1,ayat[gh.k].words.length-1);ghPaint(Array(ayat[gh.k].words.length).fill(''))};
$('#gshow').onclick=()=>{gh.base=gh.total||gh.base;ghDone([],false)};
$('#ghback').onclick=()=>location.reload();

init();
</script></body></html>
